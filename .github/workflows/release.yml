name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install dependencies
        run: npm ci

      - name: Build (emits plugin.zip via zip-pack)
        run: npm run build

      - name: Generate checksum
        run: sha256sum plugin.zip > plugin.zip.sha256

      - name: Sign ZIP with Cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle plugin.zip.bundle \
            plugin.zip

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin.zip
            plugin.zip.sha256
            plugin.zip.bundle
