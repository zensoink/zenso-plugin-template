name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack build
        run: |
          cd dist
          zip -r plugin.zip .

      - name: Generate checksum
        run: sha256sum dist/plugin.zip > dist/plugin.zip.sha256

      - name: Sign ZIP with Cosign
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/plugin.zip.bundle \
            dist/plugin.zip

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/plugin.zip
            dist/plugin.zip.sha256
            dist/plugin.zip.bundle
